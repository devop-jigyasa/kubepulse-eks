# ============================================================
# KubePulse Namespace Resource Quota & LimitRange
# Enforces FinOps resource boundaries and prevents noisy neighbors
# ============================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kubepulse-quota
  namespace: kubepulse
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "10"
    services.loadbalancers: "2"
    persistentvolumeclaims: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: kubepulse-limits
  namespace: kubepulse
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      min:
        cpu: "50m"
        memory: "64Mi"
      type: Container
