# Production High-Availability Overrides
global:
  environment: production

backend:
  replicaCount: 3
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

frontend:
  replicaCount: 3
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

mongodb:
  persistence:
    size: 20Gi
    storageClass: "gp3"
