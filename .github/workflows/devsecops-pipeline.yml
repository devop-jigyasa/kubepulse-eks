name: KubePulse DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: us-west-2
  PROJECT_NAME: kubepulse

jobs:
  # ==========================================
  # Stage 1: Code Quality & Testing
  # ==========================================
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install & Test Backend
        run: |
          cd backend
          npm ci
          npm test

  # ==========================================
  # Stage 2: Security & Static Analysis (SAST)
  # ==========================================
  security-scan:
    name: Trivy Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy File System & Secrets Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Audit mode
          format: 'table'

  # ==========================================
  # Stage 3: Infrastructure as Code Validation
  # ==========================================
  terraform-validate:
    name: Terraform Lint & Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check -recursive || true

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================
  # Stage 4: Docker Container Build & Scan
  # ==========================================
  container-build-and-scan:
    name: Container Build & Image Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [test-and-lint, security-scan]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.PROJECT_NAME }}-backend:${{ github.sha }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ${{ env.PROJECT_NAME }}-frontend:${{ github.sha }}

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.PROJECT_NAME }}-backend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.PROJECT_NAME }}-frontend:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================
  # Stage 5: Helm Chart Validation
  # ==========================================
  helm-verification:
    name: Helm Chart Lint & Template Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Lint Helm Chart
        run: |
          helm lint helm/kubepulse

      - name: Render Helm Templates
        run: |
          helm template test-release helm/kubepulse --values helm/kubepulse/values-dev.yaml
