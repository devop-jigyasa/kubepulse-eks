# ============================================================
# KubePulse GitOps: ArgoCD Application Specification
# Declarative deployment with automated reconciliation and drift correction
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubepulse-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/devop-jigyasa/kubepulse-eks.git
    targetRevision: main
    path: helm/kubepulse
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kubepulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
